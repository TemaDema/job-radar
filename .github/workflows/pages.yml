name: Job Radar Pages

# Публикует reports/dashboard.html как сайт GitHub Pages,
# чтобы статистику можно было смотреть с телефона без включённого ПК.
# Включите: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "job-radar/reports/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: cp job-radar/reports/dashboard.html job-radar/reports/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: job-radar/reports

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
